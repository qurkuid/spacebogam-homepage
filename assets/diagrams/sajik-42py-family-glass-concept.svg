<rect x="574" y="550" width="48" height="45" fill="#aaa294" stroke="#777066" stroke-width="1.5"/>
<text x="720" y="581" class="h mid" text-anchor="middle">내력기둥 + 맞춤 수납</text><path d="M62 656 H1138" class="line"/><text x="62" y="688" class="muted small">설계 원리 설명을 위한 개념도 · 실제 실측 도면, 벽체 위치 및 치수 아님</text><text x="1138" y="709" class="muted small" text-anchor="end">© SPACE BOGAM  /  2026</text></svg>