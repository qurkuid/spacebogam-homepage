<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">남겨야 할 벽을 주방 설계에 활용하다</title><desc id="svg-desc">화명 대우이안 35평의 내력벽을 활용해 냉장고를 배치하고 대면형 아일랜드로 거실 시야를 여는 방식을 설명한 개념도.</desc><style>.bg{fill:#f6f3ed}.paper{fill:#fffdf9}.pale{fill:#ebe7de}.line{stroke:#d2cdc2;stroke-width:2;fill:none}.inkline{stroke:#383630;stroke-width:3;fill:none}.dash{stroke:#847e75;stroke-width:2.6;stroke-dasharray:10 10;fill:none}.h{fill:#1e1d1a;font-family:SUIT,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-weight:500}.body{fill:#48443d;font-family:SUIT,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.muted{fill:#777167;font-family:SUIT,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.small{font-size:19px}.mid{font-size:23px}.label{font-size:25px;font-weight:600}.big{font-size:43px;font-weight:500;letter-spacing:-1.8px}</style><rect width="1200" height="740" class="bg"/><text x="62" y="55" class="h small" letter-spacing="3">SPACE BOGAM   /   PROJECT STUDY</text><path d="M62 76 H1138" class="line"/><text x="62" y="139" class="h big">남겨야 할 벽을 주방 설계에 활용하다</text><text x="62" y="183" class="body mid">화명 대우이안 35평  /  내력벽·가전·아일랜드의 설계 원리</text><rect x="62" y="220" width="390" height="404" class="paper" stroke="#d9d4ca" stroke-width="2"/><rect x="479" y="220" width="659" height="404" class="paper" stroke="#d9d4ca" stroke-width="2"/><text x="88" y="265" class="muted small" letter-spacing="2">현장의 제약과 선택</text>
<text x="88" y="318" class="h label">01  철거할 수 없는 내력벽</text><text x="120" y="350" class="body small">남겨야 할 구조를 기준으로</text><path d="M88 379 H424" class="line"/>
<text x="88" y="419" class="h label">02  냉장고의 노출 최소화</text><text x="120" y="450" class="body small">벽체 뒤편에 배치해 시야 정리</text><path d="M88 478 H424" class="line"/>
<text x="88" y="520" class="h label">03  가족을 향한 조리</text><text x="120" y="553" class="body small">대면형 아일랜드와 양면 수납</text>
<text x="502" y="265" class="muted small">각 요소의 관계 표현 / 실제 벽체 위치·평면 형상 아님</text>
<rect x="535" y="306" width="560" height="276" fill="#f7f4ee" stroke="#c8c1b7" stroke-width="2"/>
<rect x="581" y="328" width="150" height="75" fill="#ded7cc" stroke="#9e968a" stroke-width="2"/><text x="655" y="357" class="h mid" text-anchor="middle">냉장고</text><text x="655" y="385" class="body small" text-anchor="middle">배치</text>
<rect x="752" y="321" width="42" height="133" fill="#888175"/><path d="M767 326 L783 344 M767 357 L783 375 M767 388 L783 406 M767 419 L783 438" stroke="#eee8e0" stroke-width="2"/>
<text x="810" y="370" class="h mid">내력벽</text><text x="810" y="402" class="muted small">구조 유지</text>
<rect x="611" y="470" width="368" height="59" fill="#e6dfd5" stroke="#756e65" stroke-width="2"/>
<text x="795" y="503" class="h mid" text-anchor="middle">대면형 아일랜드 / 수납</text>
<path d="M795 534 V558" class="inkline"/><path d="M783 549 L795 562 L807 549" class="inkline"/>
<text x="795" y="606" class="body small" text-anchor="middle">거실에서 주방으로 이어지는 시선과 생활 동선</text><path d="M62 656 H1138" class="line"/><text x="62" y="688" class="muted small">설계 원리 설명을 위한 개념도 · 실제 실측 도면, 벽체 위치 및 치수 아님</text><text x="1138" y="709" class="muted small" text-anchor="end">© SPACE BOGAM  /  2026</text></svg>