<path d="M700 431 H726 M910 431 H938" class="dash"/><text x="814" y="593" class="body small" text-anchor="middle">거실·주방·복도에 서로 다른 사용 기준 적용</text><path d="M62 656 H1138" class="line"/><text x="62" y="688" class="muted small">설계 원리 설명을 위한 개념도 · 실제 실측 도면, 벽체 위치 및 치수 아님</text><text x="1138" y="709" class="muted small" text-anchor="end">© SPACE BOGAM  /  2026</text></svg>