<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">보이는 공간을 줄이고, 생활의 여유를 늘리다</title><desc id="svg-desc">해운대 메가센텀 49평 현장의 TV 없는 거실, 빌트인 주방, 복도 발목등과 IoT 관리 방식을 보여주는 설계 원리 개념도.</desc><style>.bg{fill:#f6f3ed}.paper{fill:#fffdf9}.pale{fill:#ebe7de}.line{stroke:#d2cdc2;stroke-width:2;fill:none}.inkline{stroke:#383630;stroke-width:3;fill:none}.dash{stroke:#847e75;stroke-width:2.6;stroke-dasharray:10 10;fill:none}.h{fill:#1e1d1a;font-family:SUIT,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-weight:500}.body{fill:#48443d;font-family:SUIT,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.muted{fill:#777167;font-family:SUIT,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.small{font-size:19px}.mid{font-size:23px}.label{font-size:25px;font-weight:600}.big{font-size:43px;font-weight:500;letter-spacing:-1.8px}</style><rect width="1200" height="740" class="bg"/><text x="62" y="55" class="h small" letter-spacing="3">SPACE BOGAM   /   PROJECT STUDY</text><path d="M62 76 H1138" class="line"/><text x="62" y="139" class="h big">보이는 공간을 줄이고, 생활의 여유를 늘리다</text><text x="62" y="183" class="body mid">해운대 메가센텀꿈에그린 49평  /  시야·수납·조명의 역할 구분</text><rect x="62" y="220" width="390" height="404" class="paper" stroke="#d9d4ca" stroke-width="2"/><rect x="479" y="220" width="659" height="404" class="paper" stroke="#d9d4ca" stroke-width="2"/><text x="88" y="263" class="muted small" letter-spacing="2">생활에서 시작한 요구</text>
<text x="88" y="315" class="h label">01  TV 없이 쉬는 거실</text><text x="120" y="346" class="body small">대화와 휴식에 집중</text><path d="M88 376 H424" class="line"/>
<text x="88" y="418" class="h label">02  밖에서 보이지 않는 가전</text><text x="120" y="449" class="body small">주방의 빌트인 수납</text><path d="M88 477 H424" class="line"/>
<text x="88" y="520" class="h label">03  밤에도 부담 없는 빛</text><text x="120" y="551" class="body small">발목등과 제어 기기 위치</text>
<text x="502" y="265" class="muted small">공간별 역할을 비교한 도식 / 실제 배치·축척 아님</text>
<rect x="517" y="302" width="183" height="253" fill="#f2eee8" stroke="#c7beb2" stroke-width="2"/>
<rect x="727" y="302" width="183" height="253" fill="#e9e4dc" stroke="#c7beb2" stroke-width="2"/>
<rect x="938" y="302" width="167" height="253" fill="#f2eee8" stroke="#c7beb2" stroke-width="2"/>
<text x="608" y="346" class="h label" text-anchor="middle">거실</text><text x="608" y="379" class="body small" text-anchor="middle">TV 없는 공간</text>
<rect x="550" y="405" width="115" height="47" rx="5" fill="#d2c9bd" stroke="#8b8478" stroke-width="2"/><text x="608" y="435" class="h small" text-anchor="middle">휴식</text><text x="608" y="503" class="muted small" text-anchor="middle">대화 · 여백</text>
<text x="818" y="346" class="h label" text-anchor="middle">주방</text><text x="818" y="379" class="body small" text-anchor="middle">빌트인 수납</text>
<rect x="753" y="404" width="130" height="51" fill="#ccc4b8" stroke="#8b8478" stroke-width="2"/><path d="M797 405 V454 M839 405 V454" class="line"/><text x="818" y="499" class="muted small" text-anchor="middle">가전 · 도어</text>
