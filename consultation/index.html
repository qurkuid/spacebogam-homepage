  <script>
  (() => {
    const help = document.getElementById('consultation-help');
    const next = document.getElementById('next');
    function positionHelp() {
      const button = next.getBoundingClientRect();
      const floating = help.getBoundingClientRect();
      const keyboard = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--consult-keyboard-inset')) || 0;
      const bottom = innerHeight - keyboard - 10;
      const overlaps = !next.hidden && button.left < floating.right && button.right > floating.left && button.top < bottom && button.bottom > bottom - floating.height;
      help.style.setProperty('--consult-button-lift', overlaps ? Math.max(0, bottom - button.top + 8) + 'px' : '0px');
    }
    addEventListener('scroll', positionHelp, {passive:true});
    addEventListener('resize', positionHelp);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', positionHelp);
    new ResizeObserver(positionHelp).observe(document.querySelector('.shell'));
    new MutationObserver(positionHelp).observe(document.getElementById('stage'), {childList:true,subtree:true});
    positionHelp();
  })();
