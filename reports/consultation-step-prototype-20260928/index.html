<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>단계별 상담 신청 | 공간보감</title>
  <style>
    @font-face{font-family:Suit;src:url('../../assets/SUIT-Variable.woff2') format('woff2');font-weight:100 900;font-display:swap}
    :root{--paper:#f6f3ed;--ink:#1e1d1a;--muted:#6c675f;--line:#d9d4ca;--accent:#877259;--error:#a33a2b}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Suit,'Apple SD Gothic Neo',sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    [hidden]{display:none!important}
    .shell{min-height:100svh;display:grid;grid-template-columns:minmax(300px,38%) 1fr}
    .aside{position:relative;min-height:100svh;overflow:hidden;background:#554b40;color:#fff}
    .aside img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
    .aside:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,20,16,.22),rgba(23,20,16,.08) 37%,rgba(23,20,16,.65))}
    .aside-content{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:36px clamp(28px,4vw,62px)}
    .brand{font-size:20px;font-weight:750;letter-spacing:-.055em;text-decoration:none;color:inherit}
    .aside-copy{max-width:400px}
    .aside-kicker,.eyebrow{margin:0 0 15px;font-size:12px;font-weight:650;letter-spacing:.12em}
    .aside-copy p:last-child{margin:0;font-size:clamp(26px,2.8vw,42px);font-weight:400;line-height:1.3;letter-spacing:-.045em}
    .main{min-width:0;min-height:100svh;display:flex;flex-direction:column}
    .topbar{height:92px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(28px,5vw,84px)}
    .prototype{color:var(--muted);font-size:13px}
    .topbar .brand{display:none}
    .close{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:4px}
    .progress{height:3px;background:#e5e0d7}
    .progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
    .stage{width:min(690px,calc(100% - 72px));margin:auto; padding:46px 0 30px}
    .step-meta{display:flex;align-items:center;gap:14px;margin-bottom:25px;color:var(--accent);font-size:13px;font-weight:700}
    .step-meta:before{content:"";width:34px;height:1px;background:var(--accent)}
    h1{max-width:650px;margin:0;font-size:clamp(38px,3.8vw,62px);font-weight:400;line-height:1.18;letter-spacing:-.055em}
    .lead{max-width:590px;margin:20px 0 40px;color:var(--muted);font-size:16px;line-height:1.75}
    .choices{display:grid;gap:12px;max-width:580px}
    .choice{position:relative;width:100%;min-height:75px;display:flex;align-items:center;gap:17px;padding:16px 20px;border:1px solid #c8c0b3;background:transparent;color:var(--ink);text-align:left;font-size:17px;transition:background .15s,border-color .15s,transform .15s}
    .choice:hover{border-color:var(--ink);transform:translateX(3px)}
    .choice[aria-pressed="true"]{border-color:var(--ink);background:#e8e1d5}
    .choice-key{width:28px;height:28px;display:grid;place-items:center;flex:none;border:1px solid #b8afa2;color:var(--muted);font-size:12px}
    .choice[aria-pressed="true"] .choice-key{background:var(--ink);border-color:var(--ink);color:var(--paper)}
    .choice-arrow{margin-left:auto;color:var(--accent)}
    .field{display:block;max-width:580px}
    .field-label{display:block;margin-bottom:12px;color:var(--muted);font-size:13px;font-weight:650}
    .input-row{display:flex;align-items:center;border-bottom:2px solid var(--ink)}
    .input-row input{width:100%;min-width:0;min-height:70px;padding:8px 0;border:0;outline:0;background:transparent;color:var(--ink);font-size:clamp(24px,2.4vw,34px);letter-spacing:-.035em}
    .input-row input::placeholder{color:#aaa49a}
    .input-row:focus-within{border-color:var(--accent)}
    .unit{padding-left:12px;color:var(--muted);font-size:17px;white-space:nowrap}
    .hint{max-width:570px;margin:15px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
    .search-results{max-width:580px;margin-top:24px}
    .result-caption{margin:0 0 10px;color:var(--muted);font-size:13px}
    .search-result{display:block;width:100%;margin-top:-1px;padding:15px 17px;border:1px solid var(--line);background:#fffdf8;text-align:left;color:var(--ink)}
    .search-result:hover,.search-result:focus-visible{background:#e8e1d5}
    .search-result strong,.search-result small{display:block}
    .search-result strong{font-size:16px}
    .search-result small{margin-top:3px;color:var(--muted);font-size:12px}
    .search-manual{width:100%;margin-top:11px;padding:12px 15px;border:1px dashed #aaa093;background:transparent;text-align:left;color:var(--muted)}
    .selected-apartment{max-width:580px;margin:14px 0 0;padding:12px 15px;background:#e8e1d5;font-size:13px;line-height:1.5}
    .dong-select{display:block;width:100%;max-width:580px;min-height:64px;padding:12px 14px;border:1px solid #c8c0b3;background:#fffdf8;color:var(--ink)}
    .question-input{display:block;width:100%;max-width:580px;min-height:64px;padding:12px 14px;border:1px solid #c8c0b3;background:#fffdf8;color:var(--ink);font-size:19px}
    textarea.question-input{min-height:150px;resize:vertical;line-height:1.55}
    .calendar{width:min(100%,580px);padding:18px;border:1px solid #c8c0b3;background:#fffdf8}
    .calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .calendar-month{font-size:20px;font-weight:650}
    .calendar-nav{width:42px;height:42px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px}
    .calendar-nav:hover,.calendar-nav:focus-visible{border-color:var(--ink);background:#e8e1d5}
    .calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
    .calendar-weekdays{margin-bottom:7px;color:var(--muted);font-size:12px}
    .calendar-weekdays span{padding:8px 0}
    .calendar-day{width:100%;min-height:42px;border:1px solid transparent;background:transparent;color:var(--ink);font-size:15px}
    .calendar-day:hover,.calendar-day:focus-visible{border-color:var(--ink);background:#e8e1d5}
    .calendar-day[aria-current="date"]{border-color:var(--accent)}
    .calendar-day[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
    .calendar-day:disabled{color:#b9b2a8;cursor:not-allowed}
    .date-undecided{display:block;width:min(100%,580px);min-height:44px;margin-top:12px;padding:8px 14px;border:1px dashed #aaa093;background:transparent;color:var(--ink);text-align:left}
    .date-undecided[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:#e8e1d5}
    .pet-choice{display:flex;align-items:center;gap:10px;width:min(100%,580px);margin-top:14px;padding:12px 14px;border:1px solid var(--line);background:#fffdf8;cursor:pointer}
    .pet-choice input{width:18px;height:18px;accent-color:var(--ink)}
    .schedule{display:grid;gap:20px;max-width:690px}
    .schedule-section{border-top:1px solid var(--line);padding-top:16px}
    .schedule-section h2{margin:0 0 10px;font-size:17px;font-weight:700}
    .schedule-hint{margin:-4px 0 12px;color:var(--muted);font-size:12px}
    .schedule-options{display:flex;flex-wrap:wrap;gap:7px}
    .schedule-weekday,.schedule-time{min-height:40px;padding:7px 12px;border:1px solid #c8c0b3;background:#fffdf8;color:var(--ink);font-size:14px}
    .schedule-weekday:hover,.schedule-time:hover,.schedule-weekday:focus-visible,.schedule-time:focus-visible{border-color:var(--ink)}
    .schedule-weekday[aria-pressed="true"],.schedule-time[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
    .schedule .calendar{max-width:420px;padding:12px}
    .schedule .calendar-header{margin-bottom:8px}
    .schedule .calendar-day{min-height:38px}
    .consent{display:flex;gap:11px;align-items:flex-start;max-width:590px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
    .consent input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--ink);flex:none}
    .consent a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
    .error{min-height:22px;margin:17px 0 0;color:var(--error);font-size:13px;font-weight:650}
    .summary{max-width:600px;margin:28px 0 0;border-top:1px solid var(--ink)}
    .summary div{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:17px 0;border-bottom:1px solid var(--line)}
    .summary dt{color:var(--muted);font-size:14px}
    .summary dd{margin:0;font-size:16px}
    .lookup-note{display:inline-flex;align-items:center;gap:9px;margin:-12px 0 28px;padding:9px 12px;background:#eae4d9;color:#5e5141;font-size:13px}
    .lookup-note:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .plan-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:690px}
    .plan-card{display:block;min-width:0;padding:0;border:1px solid #c8c0b3;background:#fffdf8;color:var(--ink);text-align:left}
    .plan-card:hover,.plan-card[aria-pressed="true"]{border-color:var(--ink)}
    .plan-card[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
    .plan-card img{width:100%;height:150px;display:block;object-fit:contain;background:#e9e5dd}
    .plan-card span{display:block;padding:11px 14px 0;font-size:15px;font-weight:700}
    .plan-card small{display:block;padding:3px 14px 13px;color:var(--muted);font-size:12px;line-height:1.45}
    .manual-option{display:block;width:100%;max-width:690px;min-height:51px;margin-top:12px;padding:11px 16px;border:1px dashed #aaa093;background:transparent;color:var(--ink);text-align:left}
    .manual-option[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:#e8e1d5}
    .plan-source{max-width:690px;margin:16px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
    .plan-dialog{width:min(980px,calc(100vw - 28px));max-width:none;max-height:calc(100svh - 28px);padding:0;border:1px solid var(--ink);background:var(--paper);color:var(--ink)}
    .plan-dialog::backdrop{background:rgba(21,19,16,.76)}
    .plan-dialog-header,.plan-controls{display:flex;align-items:center;gap:10px;padding:15px 20px}
    .plan-dialog-header{justify-content:space-between;border-bottom:1px solid var(--line)}
    .plan-close,.flip-button{min-height:40px;padding:8px 11px;border:1px solid var(--line);background:transparent;color:var(--ink)}
    .flip-button[aria-pressed="true"]{border-color:var(--ink);background:#e8e1d5}
    .plan-viewer{height:min(70svh,780px);display:grid;place-items:center;overflow:auto;background:#e9e5dd}
    .plan-large{display:block;max-width:100%;max-height:100%;object-fit:contain}
    iframe.plan-large{width:100%;height:100%;border:0}
    .plan-confirm-note{margin:0;padding:12px 20px;color:var(--muted);font-size:13px;line-height:1.5}
    .plan-controls{flex-wrap:wrap;border-top:1px solid var(--line)}
    .plan-save{min-height:40px;margin-left:auto;padding:9px 15px;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
    .summary-file{display:inline-block;margin-top:18px;color:var(--ink)}
    .summary-plan{width:min(100%,340px);max-height:220px;display:block;object-fit:contain;margin:18px 0 0;background:#e9e5dd}
    .footer{width:min(690px,calc(100% - 72px));display:flex;align-items:center;gap:18px;margin:0 auto;padding:26px 0 35px;border-top:1px solid var(--line)}
    .primary{min-width:170px;min-height:54px;display:inline-flex;justify-content:space-between;align-items:center;gap:38px;padding:12px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:650}
    .primary:disabled{opacity:.4;cursor:not-allowed}
    .back,.skip{min-height:44px;padding:8px 0;border:0;background:transparent;color:var(--muted);font-size:14px}
    .back:hover,.skip:hover{text-decoration:underline;text-underline-offset:4px}
    .footer-note{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}
    @media(max-width:800px){.shell{display:block}.aside{display:none}.topbar{height:72px;padding:0 22px}.topbar .brand{display:block;font-size:18px}.prototype{display:none}.stage{width:calc(100% - 44px);min-height:calc(100svh - 196px);padding:48px 0 30px;margin:0 auto}.step-meta{margin-bottom:22px}h1{font-size:clamp(36px,9vw,48px)}.lead{margin:18px 0 34px;font-size:15px}.choice{min-height:70px}.footer{width:calc(100% - 44px);padding:18px 0 24px}.footer-note{display:none}}
    @media(max-width:560px){.calendar{padding:12px}.calendar-grid,.calendar-weekdays{gap:1px}.calendar-day{min-height:38px}.plan-list{grid-template-columns:1fr}.plan-card{display:grid;grid-template-columns:110px 1fr;grid-template-rows:auto auto}.plan-card img{grid-row:1/3;width:110px;height:115px}.plan-card span{align-self:end}.plan-card small{align-self:start}.plan-viewer{height:58svh}.plan-controls{padding:12px}.plan-save{width:100%;margin-left:0}.plan-dialog-header{padding:12px}}
    @media(max-width:430px){.footer{gap:12px}.primary{min-width:146px}.summary div{grid-template-columns:85px 1fr;gap:12px}}
    @media(prefers-reduced-motion:reduce){.progress span,.choice{transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="aside" aria-hidden="true">
      <img src="../../assets/portfolio/mega-centum-49py.jpg" alt="">
      <div class="aside-content"><span class="brand">공간보감</span><div class="aside-copy"><p class="aside-kicker">SPACEBOGAM · CONSULTATION</p><p>어떤 집을 만들고 싶은지,<br>한 가지씩 알려주세요.</p></div></div>
    </aside>
    <main class="main">
      <div class="topbar"><span class="brand">공간보감</span><span class="prototype">단계별 상담 신청</span><button class="close" id="restart" type="button">처음부터</button></div>
      <div class="progress" role="progressbar" aria-label="입력 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
      <section class="stage" id="stage" aria-live="polite"></section>
      <div class="footer"><button class="back" id="back" type="button">← 이전</button><button class="primary" id="next" type="button">다음 <span aria-hidden="true">→</span></button><button class="skip" id="skip" type="button" hidden>이 질문 건너뛰기</button><span class="footer-note">상담 신청만으로 계약이 진행되지 않습니다.</span></div>
    </main>
  </div>
  <script src="./apt-busan-dongs.js"></script>
  <script src="./consultation-questions.js"></script>
  <script src="./flow.js?v=87cdba01bd09"></script>
</body>
</html>
